buildscript {
    ext.kotlin_version = '2.2.20'
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.4.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace 'com.nexo.ble'
    compileSdk 37
    compileSdkMinor 1

    defaultConfig {
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

kotlin {
    compilerOptions { jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17 }
}

repositories {
    google()
    mavenCentral()
    flatDir {
        dirs 'libs'
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation project(':capacitor-android')
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.biometric:biometric:1.1.0'
    // Tor (librería oficial del Guardian Project; pide compileSdk 37.1 y trae clases de Java 24: AGP 9.4). Sin su
    // kotlin-stdlib: las clases de Tor son Java puro
    implementation('info.guardianproject:tor-android:0.4.9.14') { exclude group: 'org.jetbrains.kotlin' }
    // FCM «despertador» tipo WhatsApp (#87): recibir el "toque" de Google que despierta NEXO cerrada (NexoFcmService).
    // El BOM fija versiones compatibles entre sí; solo mensajería (NO analytics ni nada que mande datos a Google). El
    // contenido del mensaje NUNCA pasa por Google: sigue P2P y E2E (ver docs/FCM.md).
    implementation platform('com.google.firebase:firebase-bom:34.3.0')
    implementation 'com.google.firebase:firebase-messaging'
}
