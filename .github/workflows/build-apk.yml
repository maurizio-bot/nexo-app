name: NEXO APK
on:
push:
branches: [BASE2005]
workflow_dispatch:
jobs:
build:
runs-on: ubuntu-latest
steps:
- name: Checkout
uses: actions/checkout@v4
- name: Setup Node.js
uses: actions/setup-node@v4
with:
node-version: '20'
- name: Setup Java 17
uses: actions/setup-java@v4
with:
distribution: 'temurin'
java-version: '17'
- name: Install Dependencies
run: npm install
- name: Clean caches
run: |
rm -rf node_modules/.cache
rm -rf android/app/src/main/assets/public
rm -rf dist
- name: Build Web Only
run: npm run build:web
- name: Verify dist exists
run: |
echo "=== CONTENIDO DE dist/ ==="
ls -la dist/
echo "=== BUSCANDO main.js ==="
find dist/ -name "*.js" -type f
- name: Pre-configure AndroidX
run: |
mkdir -p android
rm -f android/gradle.properties
echo "org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8" > android/gradle.properties
echo "org.gradle.daemon=false" >> android/gradle.properties
echo "android.useAndroidX=true" >> android/gradle.properties
echo "android.enableJetifier=true" >> android/gradle.properties
- name: Sync Capacitor
run: npx cap sync android
- name: Verify web assets copied
run: |
echo "=== CONTENIDO DE assets/public/ ==="
ls -la android/app/src/main/assets/public/ || echo "public no existe"
echo "=== BUSCANDO JS ==="
find android/app/src/main/assets/public/ -name "*.js" -type f 2>/dev/null || echo "No JS files"
- name: Emergency AndroidX Override
working-directory: ./android
env:
JAVA_HOME: {{ env.JAVA_HOME }}
run: |
rm -f gradle.properties
echo "org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8" > gradle.properties
echo "org.gradle.daemon=false" >> gradle.properties
echo "android.useAndroidX=true" >> gradle.properties
echo "android.enableJetifier=true" >> gradle.properties
echo "org.gradle.java.home=$JAVA_HOME" >> gradle.properties
chmod +x gradlew
- name: Build Android Debug APK
working-directory: ./android
run: ./gradlew clean assembleDebug --stacktrace
- name: Create Release with APK
if: success()
uses: softprops/action-gh-release@v1
with:
tag_name: nightly-${{ github.run_number }}-{{ github.sha }}
name: "NEXO Nightly Build #${{ github.run_number }}"
prerelease: true
files: android/app/build/outputs/apk/debug/app-debug.apk
generate_release_notes: true
env:
GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
