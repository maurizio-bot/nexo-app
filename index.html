<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0a">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="NEXO v9.0 - Mensajería P2P ultra-rápida">
  <meta name="format-detection" content="telephone=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' https: blob: data: gap: ws: wss:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; media-src 'self' blob:; img-src 'self' data: blob:; connect-src 'self' ws: wss: https:">

  <title>NEXO v9.0</title>

  <link rel="stylesheet" href="css/nexo-styles.css">

  <style>
    /* Estilos inline mínimos para carga inicial */
    #splash-native {
      position: fixed;
      inset: 0;
      background: #000000;
      z-index: 99999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    #splash-logo {
      width: 120px;
      height: 120px;
      background: url('assets/logo.png') center/contain no-repeat;
    }
    #splash-text {
      margin-top: 20px;
      color: #4169E1;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 18px;
      letter-spacing: 4px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <!-- Splash Screen -->
  <div id="splash-native">
    <div id="splash-logo"></div>
    <div id="splash-text">NEXO v9.0</div>
  </div>

  <!-- App Principal -->
  <div id="app">

    <!-- ==================== CHAT HEADER ==================== -->
    <div id="chat-header">
      <button id="chat-back-btn">&larr;</button>
      <div id="chat-header-center">
        <input type="text" id="chat-contact-name" value="NEXO" autocomplete="off" spellcheck="false">
        <span id="chat-contact-subtitle">OFFLINE</span>
      </div>
      <button id="chat-eye-btn">EYE</button>
    </div>

    <!-- ==================== BLE MESH HEADER ==================== -->
    <div id="ble-header">
      <button id="ble-back-btn">&larr;</button>
      <span id="ble-header-title">NEXO Meeting</span>
      <span id="ble-header-subtitle">BLUETOOTH</span>
    </div>

    <!-- ==================== CONTACTOS HEADER ==================== -->
    <div id="contacts-header">
      <button id="contacts-back-btn">&larr;</button>
      <span id="contacts-header-title">NEXO Contactos</span>
      <button id="contacts-eye-btn">EYE</button>
    </div>

    <!-- ==================== CONTENIDO PRINCIPAL ==================== -->
    <div id="nexo-stream" class="stream-container"></div>

    <div id="messages-container"></div>

    <!-- ==================== INPUT AREA ==================== -->
    <div id="input-area">
      <input type="text" id="message-input" placeholder="Mensaje..." autocomplete="off">
      <button id="send-btn">➤</button>
    </div>

  </div>

  <!-- ==================== VAULT PANEL ==================== -->
  <div id="vault-panel" class="vault-hidden">
    <div class="vault-header">
      <h3>Compartir</h3>
    </div>
    <div id="contacts-list"></div>
  </div>

  <!-- ==================== BOTONES FLOTANTES ==================== -->
  <button id="jump-to-bottom" class="hidden">↓</button>
  <button id="scan-btn">ESCANEAR</button>

  <!-- ==================== STATUS BAR ==================== -->
  <div id="status-bar">
    <span class="status-label">NEXO</span>
    <span id="status-value" class="status-ready">READY</span>
    <span id="status-context">CHAT:Galaxy S23 Ultra</span>
  </div>

  <!-- ==================== SCRIPTS ==================== -->
  <script src="src/app/nexo_app.js"></script>
  <script src="src/ui/ble_interface.js"></script>
</body>
</html>
