<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<meta name="color-scheme" content="dark">
<meta name="description" content="NEXO v9.0 - Mensajería P2P ultra-rápida">
<meta name="format-detection" content="telephone=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' https: blob: data: gap: ws: wss:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; media-src 'self' blob:; img-src 'self' data: blob:; connect-src 'self' ws: wss: https:">
<title>NEXO v9.0</title>
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<!-- Splash -->
<div id="splash-native"></div>
<!-- App -->
<div id="app">
<!-- Main Header (solo pantalla principal) -->
<div id="main-header">
<img id="main-logo" src="assets/nexo_logo.png" alt="NEXO">
<div id="main-title">Contactos</div>
<button id="ble-fab-btn" class="main-add-btn" type="button" aria-label="Agregar contacto">
<svg viewBox="0 0 24 24" width="20" height="20" fill="#fff">
<path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
</svg>
</button>
</div>
<!-- Contacts View (pantalla principal) -->
<div id="contacts-view">
<div id="main-contacts-online-strip" class="contacts-online-strip"></div>
<div id="main-contacts-list" class="contacts-list"></div>
<div id="main-contacts-empty-msg" class="contacts-empty-msg">No hay contactos. Presiona el botón + para encontrar dispositivos.</div>
</div>
<!-- Chat Header -->
<div id="chat-header">
<button id="chat-back-btn" class="chat-back-btn">
<svg viewBox="0 0 24 24" width="16" height="16" fill="#fff">
<path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z" transform="scale(-1,1) translate(-24,0)"/>
</svg>
</button>
<input type="text" id="chat-contact-name" value="" placeholder="Contacto" autocomplete="off" spellcheck="false">
<span id="chat-contact-subtitle"></span>
</div>
<!-- Messages -->
<div id="messages-container"></div>
<!-- Input Area v2 -->
<div id="input-area">
  <button id="attach-btn" class="input-btn attach-btn" type="button" aria-label="Adjuntar">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
      <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
    </svg>
  </button>
  <div class="input-wrapper">
    <textarea id="message-input" placeholder="Mensaje..." autocomplete="off" spellcheck="false" rows="1"></textarea>
  </div>
  <button id="send-btn" class="input-btn send-btn mic-mode" type="button" aria-label="Enviar">
    <svg class="send-icon" viewBox="0 0 24 24" width="16" height="16" fill="#fff">
      <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
    </svg>
    <svg class="mic-icon" viewBox="0 0 24 24" width="18" height="18" fill="#fff">
      <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.91-3c-.49 0-.9.36-.98.85C16.52 14.55 14.47 16 12 16s-4.52-1.45-4.93-4.15c-.08-.49-.49-.85-.98-.85-.61 0-1.09.54-1 1.14.49 3.31 3.21 5.86 6.41 6.36V21c0 .55.45 1 1 1s1-.45 1-1v-2.45c3.2-.5 5.92-3.05 6.41-6.36.09-.6-.39-1.14-1-1.14z"/>
    </svg>
  </button>
</div>
</div>
<!-- Vault Panel -->
<div id="vault-panel" class="vault-hidden">
<div class="vault-header">
<h3>Compartir</h3>
</div>
<div id="contacts-list"></div>
</div>
<!-- Jump Button -->
<button id="jump-to-bottom" class="hidden">↓</button>
<!-- Attach Menu (desplegable) -->
<div id="attach-menu" class="attach-menu hidden">
  <div class="attach-menu-item" data-type="camera">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="#FF3B30"><path d="M12 15.5A3.5 3.5 0 0 1 8.5 12 3.5 3.5 0 0 1 12 8.5a3.5 3.5 0 0 1 3.5 3.5 3.5 3.5 0 0 1-3.5 3.5m7.43-2.53c.04-.32.07-.64.07-.97 0-3.86-3.14-7-7-7s-7 3.14-7 7c0 .33.03.66.07.98C2.7 13.33 2 14.17 2 15.17V17c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2v-1.83c0-1-.7-1.85-1.57-2.2zM17 17H7v-1h10v1z"/></svg>
  </div>
  <div class="attach-menu-item" data-type="gallery">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="#00c8ff"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>
  </div>
  <div class="attach-menu-item" data-type="file">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="#22c55e"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>
  </div>
  <div class="attach-menu-item" data-type="location">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="#ff6b35"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
  </div>
  <div class="attach-menu-item" data-type="contact">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="#f59e0b"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
  </div>
</div>
<!-- Camera Preview Overlay -->
<div id="camera-preview-overlay" class="camera-preview-overlay hidden">
  <div id="camera-preview-container" class="camera-preview-container"></div>
  <div class="camera-preview-controls">
    <button id="camera-btn-close" class="camera-btn camera-btn-close" type="button">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="#fff"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
    </button>
    <button id="camera-btn-flip" class="camera-btn camera-btn-flip" type="button">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="#fff"><path d="M12 6v3l4-4-4-4v3c-4.42 0-8 3.58-8 8 0 1.57.46 3.03 1.24 4.26L6.7 14.8c-.45-.83-.7-1.79-.7-2.8 0-3.31 2.69-6 6-6zm6.76 1.74L17.3 9.2c.44.84.7 1.79.7 2.8 0 3.31-2.69 6-6 6v-3l-4 4 4 4v-3c4.42 0 8-3.58 8-8 0-1.57-.46-3.03-1.24-4.26z"/></svg>
    </button>
    <button id="camera-btn-capture" class="camera-btn-capture" type="button"></button>
    <button id="camera-btn-mode" class="camera-btn camera-btn-mode" type="button">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="#fff"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/></svg>
    </button>
  </div>
  <div id="camera-preview-status" class="camera-preview-status"></div>
</div>
<!-- BLE Panel (injected por JS) -->
<!-- BLE Overlay (injected por JS) -->
</body>
</html>
