name: NEXO APK

on:
  push:
    branches: [NEXOCHAT]
  workflow_dispatch:

# Necesario para que GITHUB_TOKEN pueda crear la release
permissions:
  contents: write

# Si haces varios push seguidos, cancela el build anterior y deja solo el último
concurrency:
  group: nexo-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle (cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Install Dependencies
        run: npm install

      - name: Build Web Only
        run: npm run build:web

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Configure gradle.properties
        working-directory: ./android
        run: |
          cat > gradle.properties <<EOF
          org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
          org.gradle.daemon=false
          android.useAndroidX=true
          android.enableJetifier=true
          android.jetifier.ignorelist=tor-android,jtorctl
          org.gradle.java.home=$JAVA_HOME
          EOF
          chmod +x gradlew

      # Firma SIEMPRE con la misma llave de debug: permite actualizar la app
      # sin desinstalar (y sin perder NXID, contactos ni mensajes).
      - name: Install fixed debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "::warning::Falta el secret DEBUG_KEYSTORE_BASE64: el APK se firmará con una llave nueva y no podrá actualizar la versión instalada."
            exit 0
          fi
          # Gradle en el runner no usaba ~/.android/debug.keystore (cada APK salía con otra llave):
          # la ruta se pasa explícitamente a android/app/build.gradle (signingConfigs.debug).
          KS="$RUNNER_TEMP/nexo-debug.keystore"
          echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > "$KS"
          echo "NEXO_DEBUG_KEYSTORE=$KS" >> $GITHUB_ENV
          echo "Keystore de debug fijo instalado"

      - name: Build Android Debug APK
        working-directory: ./android
        run: ./gradlew clean assembleDebug --stacktrace

      # Comprueba que el APK quedó firmado con la llave fija; si no, falla (no publicar un APK que
      # obligue a desinstalar).
      - name: Verify APK signature
        if: env.NEXO_DEBUG_KEYSTORE != ''
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          GOT=$("$APKSIGNER" verify --print-certs "$APK" | grep -m1 'certificate SHA-256 digest' | awk '{print $NF}' | tr 'A-F' 'a-f')
          WANT=$(keytool -list -v -keystore "$NEXO_DEBUG_KEYSTORE" -storepass android -alias androiddebugkey | grep -m1 'SHA256:' | awk '{print $2}' | tr -d ':' | tr 'A-F' 'a-f')
          echo "Firma del APK: $GOT"
          echo "Llave fija:    $WANT"
          if [ -z "$GOT" ] || [ "$GOT" != "$WANT" ]; then
            echo "::error::El APK no está firmado con la llave fija"
            exit 1
          fi
          echo "Firma correcta: se podrá instalar encima de la versión anterior"

      - name: Rename APK
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK" || { echo "::error::No se generó el APK"; exit 1; }
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          cp "$APK" "nexo-nightly-${{ github.run_number }}-$SHORT_SHA.apk"
          echo "APK_FILE=nexo-nightly-${{ github.run_number }}-$SHORT_SHA.apk" >> $GITHUB_ENV

      # Solo NEXOCHAT publica release; en otras ramas (workflow_dispatch) solo compila y verifica.
      - name: Upload APK (otras ramas)
        if: github.ref != 'refs/heads/NEXOCHAT'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_FILE }}
          path: ${{ env.APK_FILE }}

      - name: Create Release with APK
        if: github.ref == 'refs/heads/NEXOCHAT'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly-${{ github.run_number }}
          name: "NEXO Nightly Build #${{ github.run_number }}"
          prerelease: true
          files: ${{ env.APK_FILE }}
          generate_release_notes: true
