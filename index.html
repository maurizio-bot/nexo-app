<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<meta name="color-scheme" content="dark">
<meta name="description" content="NEXO v9.0 - Mensajería P2P ultra-rápida">
<meta name="format-detection" content="telephone=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' https: blob: data: gap: ws: wss:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; media-src 'self' blob:; img-src 'self' data: blob:; connect-src 'self' ws: wss: https:">
<title>NEXO v9.0</title>
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<!-- Splash -->
<div id="splash-native"></div>
<!-- App -->
<div id="app">
<!-- Main Header (solo pantalla principal) -->
<div id="main-header">
<img id="main-logo" src="assets/nexo_logo.png" alt="NEXO">
<div id="main-title">Contactos</div>
</div>
<!-- Contacts View (pantalla principal) -->
<div id="contacts-view">
<div id="main-contacts-online-strip" class="contacts-online-strip"></div>
<div id="main-contacts-list" class="contacts-list"></div>
<div id="main-contacts-empty-msg" class="contacts-empty-msg">No hay contactos. Presiona el botón + para encontrar dispositivos.</div>
</div>
<!-- Chat Header -->
<div id="chat-header">
<button id="chat-back-btn" class="chat-back-btn">
<svg viewBox="0 0 24 24" width="16" height="16" fill="#fff">
<path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z" transform="scale(-1,1) translate(-24,0)"/>
</svg>
</button>
<input type="text" id="chat-contact-name" value="" placeholder="Contacto" autocomplete="off" spellcheck="false">
<span id="chat-contact-subtitle"></span>
</div>
<!-- Messages -->
<div id="messages-container"></div>
<!-- Input Area v2 -->
<div id="input-area">
  <button id="attach-btn" class="input-btn attach-btn" type="button" aria-label="Adjuntar">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
      <path d="M21.586 10.461l-10.85 10.85c-1.469 1.469-3.889 1.469-5.359 0s-1.469-3.889 0-5.359l10.85-10.85c.781-.781 2.047-.781 2.828 0 .781.781.781 2.047 0 2.828l-9.414 9.414c-.391.391-1.024.391-1.414 0-.391-.391-.391-1.024 0-1.414l8-8c.391-.391 1.024-.391 1.414 0 .391.391.391 1.024 0 1.414l-8 8c-1.172 1.172-3.072 1.172-4.244 0-1.172-1.172-1.172-3.072 0-4.244l9.414-9.414c1.563-1.563 4.098-1.563 5.659 0 1.563 1.563 1.563 4.098 0 5.659z"/>
    </svg>
  </button>
  <div class="input-wrapper">
    <textarea id="message-input" placeholder="Mensaje..." autocomplete="off" spellcheck="false" rows="1"></textarea>
  </div>
  <button id="send-btn" class="input-btn send-btn mic-mode" type="button" aria-label="Enviar">
    <svg class="send-icon" viewBox="0 0 24 24" width="16" height="16" fill="#fff">
      <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
    </svg>
    <svg class="mic-icon" viewBox="0 0 24 24" width="18" height="18" fill="#fff">
      <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.91-3c-.49 0-.9.36-.98.85C16.52 14.55 14.47 16 12 16s-4.52-1.45-4.93-4.15c-.08-.49-.49-.85-.98-.85-.61 0-1.09.54-1 1.14.49 3.31 3.21 5.86 6.41 6.36V21c0 .55.45 1 1 1s1-.45 1-1v-2.45c3.2-.5 5.92-3.05 6.41-6.36.09-.6-.39-1.14-1-1.14z"/>
    </svg>
  </button>
</div>
</div>
<!-- Vault Panel -->
<div id="vault-panel" class="vault-hidden">
<div class="vault-header">
<h3>Compartir</h3>
</div>
<div id="contacts-list"></div>
</div>
<!-- Jump Button -->
<button id="jump-to-bottom" class="hidden">↓</button>
<!-- Attach Menu (desplegable) -->
<div id="attach-menu" class="attach-menu hidden">
  <div class="attach-menu-item" data-type="photo">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="#00c8ff"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>
    <span>Foto</span>
  </div>
  <div class="attach-menu-item" data-type="video">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="#a855f7"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/></svg>
    <span>Video</span>
  </div>
  <div class="attach-menu-item" data-type="file">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="#22c55e"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>
    <span>Archivo</span>
  </div>
  <div class="attach-menu-item" data-type="location">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="#ff6b35"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
    <span>Ubicación</span>
  </div>
</div>
<!-- BLE Panel (injected por JS) -->
<!-- BLE Overlay (injected por JS) -->
<!-- Attachment Handlers (Capacitor Native) -->
<script src="src/ui/attachment_handlers_capacitor.js"></script>
</body>
</html>
