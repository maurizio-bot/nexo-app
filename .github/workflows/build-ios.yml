name: NEXO iOS (compilación)

# Fase 0 de iOS (27-10): verifica que el proyecto iOS + el plugin Swift COMPILAN, en una Mac de la nube de GitHub.
# Compila para el SIMULADOR y SIN FIRMA (CODE_SIGNING_ALLOWED=NO) → no necesita cuenta Apple ni certificados.
# Para instalar en un iPhone real (TestFlight) hará falta la cuenta Apple Developer + firma (fase posterior).
# Solo corre en la rama de trabajo (no en NEXOCHAT), así no toca la línea de Android.

on:
  push:
    branches: [claude/repo-file-access-9bwl60]
    paths:
      - 'src/**'
      - 'ios/**'
      - 'plugins/**/ios/**'
      - 'plugins/**/package.json'
      - 'package.json'
      - 'capacitor.config.json'
      - '.github/workflows/build-ios.yml'
  workflow_dispatch:

concurrency:
  group: nexo-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        # El repo versiona node_modules (lo necesita Android), pero está hecho en Linux y es incompleto. En la Mac
        # del CI, `npm install` ENCIMA de ese árbol deja caniuse-lite/browserslist a medias y webpack falla
        # (MODULE_NOT_FOUND). Instalación LIMPIA: se borra node_modules y se instala de cero para este runner.
        # webpack y webpack-cli están en package.json, así que la instalación limpia los trae.
        run: |
          rm -rf node_modules
          npm install

      - name: Build Web Only
        run: npm run build:web

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Pod install
        working-directory: ios/App
        run: pod install --repo-update

      - name: Compilar iOS (simulador, sin firma)
        working-directory: ios/App
        # xcodebuild es muy verboso; si se filtra con `tail` se pierde la línea `error:`. Se guarda el log COMPLETO
        # y, si falla, se imprimen las líneas de error y el final del log (para ver la causa real del fallo).
        # OJO (arreglado): NO usar «| grep … || true» y luego ${PIPESTATUS[0]} — el «|| true» ejecuta otro comando y
        # PISA PIPESTATUS, así que el código real de xcodebuild se perdía (daba 0) y el job salía VERDE con BUILD
        # FAILED. En su lugar: `set +e` evita que -e aborte y se lee PIPESTATUS[0] (= xcodebuild) justo tras la tubería.
        run: |
          set +e
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            clean build 2>&1 | tee /tmp/xcodebuild.log | grep -E --line-buffered 'error:|warning: .*(NexoBle|App)|BUILD SUCCEEDED|BUILD FAILED|Compiling'
          code=${PIPESTATUS[0]}
          echo "xcodebuild exit = $code"
          if [ "$code" != "0" ]; then
            echo "===== líneas con 'error:' ====="
            grep -nE 'error:' /tmp/xcodebuild.log | head -60 || echo "(ninguna línea 'error:' en el log)"
            echo "===== últimas 150 líneas del log ====="
            tail -150 /tmp/xcodebuild.log
            exit "$code"
          fi
