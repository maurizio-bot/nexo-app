name: NEXO APK

on:
  push:
    branches: [NEXOCHAT]
  workflow_dispatch:

# Necesario para que GITHUB_TOKEN pueda crear la release
permissions:
  contents: write

# Si haces varios push seguidos, cancela el build anterior y deja solo el último
concurrency:
  group: nexo-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Pruebas antes de publicar: si alguna falla, no se compila ni se publica la APK
  tests:
    # 2945: fijado a 24.04 — GitHub pasó `ubuntu-latest` a Ubuntu 26.04 el 07-11 y Playwright 1.56.1 no
    # instala Chromium ahí («Playwright does not support chromium on ubuntu26.04-x64»), lo que tumbaba el paso
    # «Chromium para las pruebas de videollamada» en TODOS los builds (no es del código). 24.04 es el entorno
    # con el que se construyó la 2943 y todos los anteriores. Pendiente: subir Playwright cuando 24.04 se retire.
    runs-on: ubuntu-24.04
    # El paso «Chromium» (playwright install, sin caché) tarda ~9 min fijos; con la batería del simulador (~19-20 min)
    # el job rozaba los 30 min y GitHub lo cortaba como «cancelado» (builds 2935 attempt 1 y 2). 45 da margen de sobra.
    # 14-11 (APK 3049, run 43552006942): la batería creció a 238 pruebas y tardó 43 min en el servidor: GitHub cortó el job a los
    # 45 min como «cancelado» sin ningún fallo. 75 deja margen para seguir sumando pruebas.
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Dependencias del simulador
        working-directory: ./tests/sim
        run: npm ci --no-audit --no-fund

      # Ronda 2772: la videollamada de verdad (videoframe.js: espejo, forma y encuadre de la imagen) usa Chromium con
      # Playwright (cámara falsa en vertical); sin esto la prueba no arrancaba en GitHub
      # 3007: las builds 3006 (intentos 1 y 2) se cayeron aquí porque el servidor no resolvía el espejo de apt de Ubuntu
      # («Temporary failure resolving 'azure.archive.ubuntu.com'») al bajar 9 paquetes de FUENTES opcionales; las librerías que
      # Chromium necesita ya vienen en la imagen. Si --with-deps falla, se instala solo Chromium (su descarga es de otro sitio).
      - name: Chromium para las pruebas de videollamada
        working-directory: ./tests/sim
        timeout-minutes: 20
        run: |
          npx playwright install --with-deps chromium || {
            echo "apt falló (espejo de Ubuntu); instalo solo Chromium"
            npx playwright install chromium
          }

      - name: Compilar el bundle para el simulador
        run: bash tests/sim/build.sh wip

      - name: Nada sin definir en el código de la app
        run: node tests/sim/undef.js

      # Después de instalar las librerías del simulador: NetBgTest las usa para comparar con la app
      - name: Pruebas Kotlin (JVM)
        working-directory: ./tests/kotlin
        run: gradle --no-daemon test

      - name: Pruebas del simulador
        working-directory: ./tests/sim
        run: node ci.js builds/wip

      - name: Registros de las pruebas (si alguna falla)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: registros-pruebas-${{ github.run_number }}
          path: tests/sim/last_logs_*.txt
          retention-days: 7

  build:
    needs: tests
    # 2945: fijado a 24.04 igual que `tests` (ver nota arriba) — restaura el entorno con el que se armó la 2943.
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle (cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Install Dependencies
        run: npm install

      - name: Build Web Only
        run: npm run build:web

      - name: Número de build en la app (diagnóstico)
        run: sed -i "s/__NEXO_BUILD__/${{ github.run_number }}/g" dist/index.html

      - name: Sync Capacitor
        run: npx cap sync android


      - name: Ajustar módulos de Capacitor 5 para AGP 9
        run: bash scripts/agp9-patch.sh

      - name: Configure gradle.properties
        working-directory: ./android
        run: |
          cat > gradle.properties <<EOF
          org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
          org.gradle.daemon=false
          android.useAndroidX=true
          android.enableJetifier=true
          android.jetifier.ignorelist=tor-android,jtorctl
          android.builtInKotlin=false
          android.newDsl=false
          org.gradle.java.home=$JAVA_HOME
          EOF
          chmod +x gradlew

      # Firma SIEMPRE con la misma llave de debug: permite actualizar la app
      # sin desinstalar (y sin perder NXID, contactos ni mensajes).
      - name: Install fixed debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "::warning::Falta el secret DEBUG_KEYSTORE_BASE64: el APK se firmará con una llave nueva y no podrá actualizar la versión instalada."
            exit 0
          fi
          # Gradle en el runner no usaba ~/.android/debug.keystore (cada APK salía con otra llave):
          # la ruta se pasa explícitamente a android/app/build.gradle (signingConfigs.debug).
          KS="$RUNNER_TEMP/nexo-debug.keystore"
          echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > "$KS"
          echo "NEXO_DEBUG_KEYSTORE=$KS" >> $GITHUB_ENV
          echo "Keystore de debug fijo instalado"

      - name: Build Android Debug APK
        working-directory: ./android
        run: ./gradlew clean assembleDebug --stacktrace

      # Comprueba que el APK quedó firmado con la llave fija; si no, falla (no publicar un APK que
      # obligue a desinstalar).
      - name: Verify APK signature
        if: env.NEXO_DEBUG_KEYSTORE != ''
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          GOT=$("$APKSIGNER" verify --print-certs "$APK" | grep -m1 'certificate SHA-256 digest' | awk '{print $NF}' | tr 'A-F' 'a-f')
          WANT=$(keytool -list -v -keystore "$NEXO_DEBUG_KEYSTORE" -storepass android -alias androiddebugkey | grep -m1 'SHA256:' | awk '{print $2}' | tr -d ':' | tr 'A-F' 'a-f')
          echo "Firma del APK: $GOT"
          echo "Llave fija:    $WANT"
          if [ -z "$GOT" ] || [ "$GOT" != "$WANT" ]; then
            echo "::error::El APK no está firmado con la llave fija"
            exit 1
          fi
          echo "Firma correcta: se podrá instalar encima de la versión anterior"

      - name: Rename APK
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK" || { echo "::error::No se generó el APK"; exit 1; }
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          cp "$APK" "nexo-nightly-${{ github.run_number }}-$SHORT_SHA.apk"
          echo "APK_FILE=nexo-nightly-${{ github.run_number }}-$SHORT_SHA.apk" >> $GITHUB_ENV

      # Solo NEXOCHAT publica release; en otras ramas (workflow_dispatch) solo compila y verifica.
      - name: Upload APK (otras ramas)
        if: github.ref != 'refs/heads/NEXOCHAT'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_FILE }}
          path: ${{ env.APK_FILE }}

      - name: Create Release with APK
        if: github.ref == 'refs/heads/NEXOCHAT'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly-${{ github.run_number }}
          name: "NEXO Nightly Build #${{ github.run_number }}"
          prerelease: true
          files: ${{ env.APK_FILE }}
          generate_release_notes: true
