name: NEXO APK

on:
  push:
    branches: [NEXOCHAT]
  workflow_dispatch:

# Necesario para que GITHUB_TOKEN pueda crear la release
permissions:
  contents: write

# Si haces varios push seguidos, cancela el build anterior y deja solo el último
concurrency:
  group: nexo-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle (cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Install Dependencies
        run: npm install

      - name: Build Web Only
        run: npm run build:web

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Configure gradle.properties
        working-directory: ./android
        run: |
          cat > gradle.properties <<EOF
          org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
          org.gradle.daemon=false
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.java.home=$JAVA_HOME
          EOF
          chmod +x gradlew

      # Firma SIEMPRE con la misma llave de debug: permite actualizar la app
      # sin desinstalar (y sin perder NXID, contactos ni mensajes).
      - name: Install fixed debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "::warning::Falta el secret DEBUG_KEYSTORE_BASE64: el APK se firmará con una llave nueva y no podrá actualizar la versión instalada."
            exit 0
          fi
          mkdir -p ~/.android
          echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore
          echo "Keystore de debug fijo instalado"

      - name: Build Android Debug APK
        working-directory: ./android
        run: ./gradlew clean assembleDebug --stacktrace

      - name: Rename APK
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK" || { echo "::error::No se generó el APK"; exit 1; }
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          cp "$APK" "nexo-nightly-${{ github.run_number }}-$SHORT_SHA.apk"
          echo "APK_FILE=nexo-nightly-${{ github.run_number }}-$SHORT_SHA.apk" >> $GITHUB_ENV

      - name: Create Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly-${{ github.run_number }}
          name: "NEXO Nightly Build #${{ github.run_number }}"
          prerelease: true
          files: ${{ env.APK_FILE }}
          generate_release_notes: true
