name = "nexo-wake"
main = "worker.js"
compatibility_date = "2024-11-01"
# El secreto SA_B64 se pone con: wrangler secret put SA_B64  (o en el panel de Cloudflare).
# 14A (23-11): el sello del toque. WAKE_KEY = 32 bytes al azar en base64:  openssl rand -base64 32 | npx wrangler secret put WAKE_KEY
# Cuando TODOS los teléfonos tengan la versión con sello:  echo 1 | npx wrangler secret put ONLY_SEALED  (toques sin sello → rechazados)
