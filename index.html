<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0a">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="NEXO v9.0 - Mensajería P2P ultra-rápida">
  <meta name="format-detection" content="telephone=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' https: blob: data: gap: ws: wss:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; media-src 'self' blob:; img-src 'self' data: blob:; connect-src 'self' ws: wss: https:">

  <title>NEXO v9.0</title>

  <style>
    #vault-panel {
      display: none !important;
      visibility: hidden !important;
      opacity: 0 !important;
      pointer-events: none !important;
      position: absolute !important;
      z-index: -9999 !important;
    }
    #splash-native {
      position: fixed;
      inset: 0;
      background: #0a0a0a;
      z-index: 999999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    body {
      background: #0a0a0a;
      overflow: hidden;
      margin: 0;
      padding: 0;
    }
    /* CHAT BACK BUTTON - FIX: azul y posicionado a la izquierda */
    .chat-back-btn {
      background: none;
      border: none;
      color: #0082FC;
      font-size: 22px;
      cursor: pointer;
      padding: 0 8px;
      width: 40px;
      height: 40px;
      display: none;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
    }
    .chat-back-btn.visible {
      display: flex;
    }
    #chat-header {
      display: flex;
      flex-direction: row !important;
      align-items: center;
      justify-content: center;
      padding: 8px 12px;
      border-bottom: 1px solid #333;
      gap: 8px;
      position: relative;
    }
    #chat-contact-name {
      background: none;
      border: none;
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      flex: 1;
      outline: none;
      text-align: center;
    }
    #chat-contact-subtitle {
      font-size: 11px;
      color: #888;
    }
    /* JUMP BUTTON */
    #jump-to-bottom {
      position: fixed;
      bottom: 80px;
      right: 16px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(0, 132, 255, 0.9);
      color: #fff;
      border: none;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.3s, transform 0.3s;
      pointer-events: none;
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
    }
    #jump-to-bottom.visible {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }
    /* FIX: Ocultar vista de chat cuando no está activa */
    #app:not(.chat-view-active) #chat-header,
    #app:not(.chat-view-active) #nexo-stream,
    #app:not(.chat-view-active) #input-area,
    #app:not(.chat-view-active) #jump-to-bottom {
      display: none !important;
    }
  </style>
</head>
<body>
  <div id="splash-native">
    <div id="splash-logo"></div>
    <div id="splash-text">NEXO v9.0</div>
  </div>

  <div id="app">
    <div id="chat-header">
      <button id="chat-back-btn" class="chat-back-btn">&larr;</button>
      <input type="text" id="chat-contact-name" value="NEXO" autocomplete="off" spellcheck="false">
      <span id="chat-contact-subtitle">OFFLINE</span>
    </div>

    <div id="nexo-stream" class="stream-container">
      <div id="messages-container"></div>
    </div>

    <div id="input-area">
      <input type="text" id="message-input" placeholder="Mensaje..." autocomplete="off">
      <button id="send-btn">➤</button>
    </div>
  </div>

  <div id="vault-panel" class="vault-hidden">
    <div class="vault-header">
      <h3>Compartir</h3>
    </div>
    <div id="contacts-list"></div>
  </div>

  <button id="jump-to-bottom" class="hidden">↓</button>

</body>
</html>
