<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="NEXO v10.0 - Mensajería P2P segura">
  <meta name="format-detection" content="telephone=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' https: blob: data: gap: ws: wss:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'unsafe-eval';">
  <title>NEXO v10.0</title>
  <link rel="stylesheet" href="critical.css">
</head>
<body>
  <!-- SPLASH SCREEN -->
  <div id="splash-native">
    <div id="splash-logo"></div>
    <div id="splash-text">NEXO v10.0</div>
  </div>

  <!-- UI PRINCIPAL -->
  <div id="app">
    <!-- CHAT HEADER -->
    <div id="chat-header">
      <button id="ble-scan-btn" title="Escanear BLE">&#9673;</button>
      <input type="text" id="chat-contact-name" value="NEXO" autocomplete="off" spellcheck="false">
      <span id="chat-contact-subtitle">OFFLINE</span>
    </div>

    <!-- MESSAGES AREA -->
    <div id="nexo-stream" class="stream-container">
      <div id="messages-container"></div>
    </div>

    <!-- INPUT AREA -->
    <div id="input-area">
      <input type="text" id="message-input" placeholder="Mensaje..." autocomplete="off">
      <button id="send-btn">&#10148;</button>
    </div>
  </div>

  <!-- VAULT PANEL (Compartir) - OCULTO POR DEFECTO -->
  <div id="vault-panel">
    <div class="vault-header">
      <h3>Compartir</h3>
      <button class="vault-close" id="vault-close-btn">Cerrar</button>
    </div>
    <div id="contacts-list"></div>
  </div>

  <!-- SCRIPTS -->
  <script src="main.js" type="module"></script>
</body>
</html>
