apply plugin: 'com.android.application'

android {
    namespace "com.nexo.app"
    compileSdkVersion 37
    compileSdkMinor 1
    
    defaultConfig {
        applicationId "com.nexo.app"
        minSdkVersion 26
        targetSdkVersion 34
        // COLA 26: Google Play exige un versionCode que SUBA en cada subida. Sin estas variables (APK de GitHub, local) valen lo de siempre:
        // 1 y "1.0". El CI de tienda exporta NEXO_VERSION_CODE (p. ej. el número de ejecución) y NEXO_VERSION_NAME.
        versionCode Integer.parseInt(System.getenv('NEXO_VERSION_CODE') ?: '1')
        versionName System.getenv('NEXO_VERSION_NAME') ?: '1.0'
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // Solo los procesadores de los teléfonos Android (Tor trae ~7 MB por arquitectura; x86 es de emuladores)
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
        
        packagingOptions {
            pickFirst 'lib/x86/libc++_shared.so'
            pickFirst 'lib/x86_64/libc++_shared.so'
            pickFirst 'lib/armeabi-v7a/libc++_shared.so'
            pickFirst 'lib/arm64-v8a/libc++_shared.so'
        }
        
        aaptOptions {
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    
    // Firma fija para que cada APK pueda instalarse encima de la anterior. El workflow escribe la
    // llave (secret DEBUG_KEYSTORE_BASE64) y exporta su ruta en NEXO_DEBUG_KEYSTORE. Sin esa variable
    // (compilación local) se usa la llave de debug por defecto.
    signingConfigs {
        debug {
            def nexoKeystore = System.getenv('NEXO_DEBUG_KEYSTORE')
            if (nexoKeystore && file(nexoKeystore).exists()) {
                storeFile file(nexoKeystore)
                storeType 'pkcs12'
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }

    // COLA 26: llave de SUBIDA a Google Play (solo para el tipo «store»; la APK de GitHub sigue con la de debug). Nada de secretos en el
    // repositorio: el CI escribe el archivo y exporta estas variables. Sin ellas el AAB sale SIN firmar (y se firma aparte con jarsigner).
    if (System.getenv('NEXO_UPLOAD_KEYSTORE') && file(System.getenv('NEXO_UPLOAD_KEYSTORE')).exists()) {
        signingConfigs {
            store {
                storeFile file(System.getenv('NEXO_UPLOAD_KEYSTORE'))
                storePassword System.getenv('NEXO_UPLOAD_STORE_PASSWORD')
                keyAlias System.getenv('NEXO_UPLOAD_KEY_ALIAS')
                keyPassword System.getenv('NEXO_UPLOAD_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        // Seguridad: aunque se compila la variante debug (misma firma fija, se instala encima), la APK NO es
        // depurable: con depuración cualquiera con un cable USB podía leer los archivos internos (run-as) e
        // inspeccionar la app (WebView depurable).
        debug {
            signingConfig signingConfigs.debug
            debuggable false
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        // COLA 26: versión de GOOGLE PLAY (`./gradlew bundleStore` → app-store.aab). Igual que release (sin reducción de código,
        // no depurable) pero: su manifiesto (src/store/AndroidManifest.xml) QUITA REQUEST_INSTALL_PACKAGES, y el CI de tienda marca el
        // index.html con NEXO_STORE=1 (la web oculta «Actualizaciones» y no consulta GitHub). Los módulos (capacitor, nexo-ble…) solo
        // tienen debug y release: se usa su release. NO afecta a assembleDebug (la APK de GitHub).
        store {
            initWith release
            matchingFallbacks = ['release']
            debuggable false
            if (signingConfigs.findByName('store')) signingConfig signingConfigs.store
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
    mavenCentral()
    google()
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.activity:activity-ktx:1.8.0"
    implementation "androidx.core:core-ktx:1.12.0"
    implementation "androidx.biometric:biometric:1.1.0"
    
    implementation project(':capacitor-android')
    implementation project(':capacitor-cordova-android-plugins')
    implementation project(':capacitor-nexo-auth')
    implementation project(':nexo-ble')
    
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
