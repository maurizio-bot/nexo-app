<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0a">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="NEXO v9.0 - Mensajería P2P ultra-rápida">
  <meta name="format-detection" content="telephone=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' https: blob: data: gap: ws: wss:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; media-src 'self' blob:; img-src 'self' data: blob:; connect-src 'self' ws: wss: https:">

  <title>NEXO v9.0</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <!-- Splash -->
  <div id="splash-native">
    <div id="splash-logo"></div>
    <div id="splash-text">NEXO v9.0</div>
  </div>

  <!-- App -->
  <div id="app">
    <!-- Header Pantalla Principal -->
    <div id="main-header">
      <img src="./assets/logo_solo.jpg" alt="NEXO" id="main-logo">
      <span id="main-title">CONTACTOS</span>
    </div>

    <!-- Chat Header -->
    <div id="chat-header">
      <button id="chat-back-btn" class="chat-back-btn">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="#fff">
          <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z" transform="scale(-1,1) translate(-24,0)"/>
        </svg>
      </button>
      <input type="text" id="chat-contact-name" value="NEXO" autocomplete="off" spellcheck="false">
      <span id="chat-contact-subtitle"></span>
    </div>

    <!-- Stream Principal -->
    <div id="nexo-stream" class="stream-container"></div>

    <!-- Messages -->
    <div id="messages-container"></div>

    <!-- Input eliminado de pantalla principal -->
  </div>

  <!-- Vault Panel -->
  <div id="vault-panel" class="vault-hidden">
    <div class="vault-header">
      <h3>Compartir</h3>
    </div>
    <div id="contacts-list"></div>
  </div>

  <!-- Jump Button -->
  <button id="jump-to-bottom" class="hidden">&darr;</button>

  <!-- BLE Panel (injected por JS) -->
  <!-- BLE Overlay (injected por JS) -->

</body>
</html>
